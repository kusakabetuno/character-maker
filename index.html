<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>キャラクターメーカー</title>
<style>
:root{--bg:#17191c;--panel:#24272b;--panel2:#30343a;--text:#f1f3f5;--muted:#aeb4bb;--line:#4a5058;--accent:#d9dde2;--soft:#3b4047;--tag:#626a74;--tagText:#ffffff;--danger:#e0a4a0}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea{font:inherit} button{cursor:pointer}
header{position:sticky;top:0;z-index:10;background:rgba(39,42,46,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.top{max-width:1280px;margin:auto;padding:14px 22px;display:flex;align-items:center;gap:12px}.top h1{font-size:19px;margin:0}.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:8px 12px}.btn:hover{background:var(--soft)}.btn.primary{background:var(--accent);color:#202225;border-color:var(--accent);font-weight:650}.btn.danger{color:var(--danger)}
main{max-width:1280px;margin:auto;padding:22px;display:grid;grid-template-columns:270px 1fr;gap:20px}
.sidebar,.editor{background:var(--panel);border:1px solid var(--line);border-radius:14px}.sidebar{padding:14px;height:calc(100vh - 92px);position:sticky;top:78px;display:flex;flex-direction:column;overflow:hidden}.editor{padding:22px;min-height:70vh}
.side-head{display:flex;gap:8px;margin-bottom:12px} #charList{overflow:auto;min-height:90px;flex:1}.side-head .btn{flex:1}.side-memo{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;flex:0 0 210px;display:flex;flex-direction:column}
.side-memo-head{font-size:13px;font-weight:700;margin-bottom:7px;color:var(--text)}
.side-memo textarea{width:100%;height:100%;min-height:120px;resize:none;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:9px;font-size:12px;line-height:1.55}
.btn.locked{background:#737b85;color:#fff;border-color:#8b949f}
.search{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:9px 10px;margin-bottom:10px}
.char{padding:10px;border-radius:9px;display:flex;align-items:center;gap:8px}.char:hover,.char.active{background:var(--soft)}.char-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:60px 20px}.name{font-size:23px;font-weight:700;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);width:100%;padding:8px 2px;margin-bottom:18px;outline:none}
.field-groups{display:flex;flex-direction:column;gap:26px}
.field-group{min-width:0}
.group-heading{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid #515861;padding:0 2px 8px;margin-bottom:11px}
.group-title{font-size:16px;font-weight:750;color:#f5f6f7;letter-spacing:.02em}
.group-desc{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.field{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px;min-width:0;font-size:13px}.field-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}.field-title{font-weight:650;flex:1;font-size:13px}.mini{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px;padding:4px 8px;font-size:12px}
.tags{display:flex;gap:6px;flex-wrap:wrap;min-height:28px}.tag{background:var(--tag);color:var(--tagText);border:1px solid #747d88;border-radius:999px;padding:4px 7px;font-size:12px}.tag button{border:0;background:none;color:var(--muted);padding:0 0 0 5px}
.add{margin-top:9px;width:100%;border:1px dashed #cbd0d7;background:var(--panel2);color:var(--text);border-radius:8px;padding:7px;color:var(--muted)}
.notes{margin-top:14px}.notes textarea{width:100%;min-height:110px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px;resize:vertical}
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.32);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}.modal-wrap.show{display:flex}.modal{width:min(650px,100%);max-height:80vh;background:var(--panel);color:var(--text);border-radius:14px;padding:18px;display:flex;flex-direction:column}.modal h2{margin:0 0 12px;font-size:18px}
.hair-layout{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:12px;min-height:260px}
.hair-preview{display:none;position:sticky;top:0;align-self:start;background:#202328;border:1px solid #555d66;border-radius:11px;padding:10px;text-align:center}
.hair-preview.show{display:block}
.hair-preview svg{width:150px;height:170px;display:block;margin:auto}
.hair-preview-name{font-size:13px;font-weight:700;margin-top:5px}
.hair-preview-note{font-size:10px;color:var(--muted);margin-top:4px}
@media(max-width:650px){.hair-layout{grid-template-columns:1fr}.hair-preview{position:static;order:-1}.hair-preview svg{width:120px;height:135px}}
.options{overflow:auto;border-top:1px solid var(--line);margin-top:10px;padding-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px}.option{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:8px;text-align:left}.mini.selected{background:#d0d4d9;color:#202225;border-color:#d0d4d9;font-weight:700}.option.selected{background:#747d88;color:#fff;border-color:#9099a4;font-weight:700}.custom{display:flex;gap:8px;margin-top:10px}.custom input{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:8px}
.footer-actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.toast{position:fixed;right:20px;bottom:20px;background:#202124;color:#fff;padding:9px 13px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(max-width:1050px){.grid{grid-template-columns:1fr 1fr}} @media(max-width:750px){main{grid-template-columns:1fr}.sidebar{height:auto;position:static;overflow:visible}.side-memo{flex-basis:170px}#charList{max-height:260px}.grid{grid-template-columns:1fr}}

/* 呼称カード：通常のフィールドカードと同じ外枠を使う */
.field.call-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0;display:block}
.field.call-card .field-title{margin-bottom:6px}
.call-body{display:flex;flex-direction:column}
.field.call-card .call-row{padding:8px 0;border-top:1px solid var(--line);min-width:0}
.field.call-card .call-row:first-child{border-top:0;padding-top:2px}
.field.call-card .call-label{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:5px}
.field.call-card .call-tags{display:flex;gap:5px;flex-wrap:wrap;min-height:24px;align-items:center;min-width:0}
.field.call-card .call-pick{width:100%;margin-top:6px;padding:6px 8px;font-size:11px}


/* モーダルは常に画面内に収め、内容だけをスクロール */
.modal-wrap{padding:18px;overflow:hidden}
.modal{max-height:calc(100vh - 36px);overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.modal::-webkit-scrollbar{width:10px}
.modal::-webkit-scrollbar-thumb{background:#626a74;border-radius:10px;border:2px solid var(--panel)}
.modal::-webkit-scrollbar-track{background:transparent}
.options{max-height:none!important;overflow:visible!important}
.hair-layout .options{max-height:none!important;overflow:visible!important}
.hair-preview{top:0}
.hair-preview img{width:170px;height:210px;object-fit:cover;object-position:center;border-radius:9px;display:block;margin:0 auto;background:#181a1d}
.hair-preview-source{font-size:9px;color:var(--muted);margin-top:5px;line-height:1.35}
@media(max-width:650px){
 .modal-wrap{padding:8px}
 .modal{max-height:calc(100vh - 16px)}
 .hair-preview img{width:140px;height:170px}
}

.hair-no-preview{height:190px;display:grid;place-content:center;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:9px;line-height:1.6;background:#181a1d}

.sidebar{display:flex;flex-direction:column}
#charList{flex:1;min-height:0;overflow-y:auto}
.side-memo{order:0;margin-bottom:10px}
.side-head-bottom{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.side-head-bottom .btn{width:100%}

/* 性別・年齢：独立カードを縦に2枚 */
.gender-age-stack{display:grid;grid-template-columns:1fr;gap:10px;min-width:0}
.gender-age-stack>.field{min-height:0}

/* 誕生日・星座 */
.birthday-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.birth-select{width:100%;background:#17191c;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;outline:none}
.zodiac-display{display:flex;justify-content:space-between;align-items:center;margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:12px}
.zodiac-display span{color:var(--muted)}
.zodiac-display strong{font-size:13px}

/* 誕生日プルダウン：他カードと同じトーン */
.birth-select{
 background:var(--panel2)!important;
 color:var(--text)!important;
 border:1px solid #555d66!important;
 border-radius:8px;
 padding:8px 10px;
 color-scheme:dark;
}
.birth-select:hover{background:#343940!important;border-color:#69727d!important}
.birth-select:focus{background:#343940!important;border-color:#89939f!important;box-shadow:0 0 0 2px rgba(150,160,170,.12)}
.birth-select option{background:#30343a;color:var(--text)}

/* 誕生日・星座・誕生石：カード内を均等な3段に */
.birthday-card{display:flex!important;flex-direction:column}
.birth-info-grid{
 display:grid;
 grid-template-rows:repeat(3,minmax(58px,1fr));
 flex:1;
 margin-top:2px;
}
.birth-info-section{
 min-height:58px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 padding:9px 0;
 border-top:1px solid var(--line);
}
.birth-info-section:first-child{border-top:0}
.birth-info-label{font-size:11px;color:var(--muted);font-weight:700;flex:0 0 auto}
.birth-info-section strong{font-size:13px;text-align:right}
.birth-date-section{display:grid;grid-template-columns:auto 1fr;align-items:center}
.birth-date-section .birthday-row{margin:0;min-width:0}
.birthday-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}

/* 誕生石・花の補足情報 */
.info-hover{position:relative;cursor:help;text-decoration:underline dotted;text-underline-offset:3px}
.info-pop{
 display:none;position:absolute;z-index:50;right:0;top:calc(100% + 8px);
 width:250px;padding:10px 11px;background:#17191c;border:1px solid #5d6570;
 border-radius:9px;box-shadow:0 10px 28px rgba(0,0,0,.45);font-size:11px;
 line-height:1.55;font-weight:400;text-align:left;color:var(--text)
}
.info-hover:hover .info-pop,.info-hover:focus .info-pop{display:block}
.info-pop a,.flower-source a{display:block;color:#b9c9e6;margin-top:6px;text-decoration:none}
.info-pop a:hover,.flower-source a:hover{text-decoration:underline}
.flower-selected{width:100%;padding:7px 0;border-bottom:1px solid var(--line)}
.flower-selected:last-child{border-bottom:0}
.flower-mini{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:10px;color:var(--muted)}
.flower-mini b{font-weight:600;color:#c9cdd2;text-align:right}
.flower-source{font-size:9px;color:var(--muted);margin-top:8px;line-height:1.4}
.flower-source a{display:inline;margin-left:3px}

/* イメージする花：通常カードと同じレイアウト */
.field.flower-field{display:flex;flex-direction:column;min-width:0}
.field.flower-field .field-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
.field.flower-field .selected{display:flex;gap:5px;flex-wrap:wrap;min-height:28px;align-items:center;margin:4px 0 7px}
.field.flower-field .pick{width:100%;margin-top:auto}
.flower-field .flower-source{font-size:9px;color:var(--muted);margin-top:7px;line-height:1.35}
.flower-tag{display:inline-flex!important;align-items:center;position:relative}
.flower-tag .info-pop{white-space:normal}
.flower-pop-desc,.flower-pop-words{display:block}
.flower-pop-words{margin-top:6px;color:#d8dce2;font-weight:600}
.flower-tag button{position:relative;z-index:2}

/* 花カードは通常フィールドと完全に同じ操作部品を使用 */
.field.flower-field .tags{display:flex;gap:6px;flex-wrap:wrap;min-height:28px;align-items:center}
.field.flower-field .add{width:100%}
.field.flower-field .mini{width:auto}

/* 誕生石・花：マウスオーバー参考画像 */
.info-thumb{
 display:block;width:100%;height:86px;object-fit:cover;
 border-radius:7px;margin:0 0 8px;border:1px solid #4d535b;background:#25282d
}

/* 実物写真のみを表示。簡易イラストは使用しない */
.info-pop .photo-pending{
 display:block;padding:8px;margin-bottom:7px;border:1px solid var(--line);
 border-radius:7px;color:var(--muted);font-size:10px;text-align:center
}

.hair-source-link{display:block;margin-top:8px;font-size:10px;color:#b9c9e6;text-decoration:none}
.hair-source-link:hover{text-decoration:underline}

.profile-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-width:0}
.profile-head .name{flex:1 1 300px;min-width:180px;margin-bottom:0}
.profile-meta{display:flex;align-items:center;gap:7px;flex:0 1 auto}
.profile-select{background:#30343a;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 8px;font:inherit;min-width:88px}
.head-birthday{display:flex;gap:5px}.head-birthday .profile-select{min-width:72px}
.editor-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:18px}.editor-actions .btn{white-space:nowrap}
@media(max-width:900px){.profile-head{align-items:stretch;flex-direction:column}.profile-meta{flex-wrap:wrap}.profile-select{flex:1}.head-birthday{flex:1 1 150px}.head-birthday .profile-select{flex:1}}
</style>
</head>
<body>
<header><div class="top"><h1>キャラクターメーカー</h1><div class="spacer"></div><button class="btn primary" id="headerSaveBtn">保存</button><button class="btn" id="headerLockBtn">🔓 ロック</button><button class="btn danger" id="headerDeleteBtn">削除</button><button class="btn" id="exportBtn">バックアップ</button><button class="btn" id="importBtn">復元</button><input type="file" id="importFile" accept=".json" hidden></div></header>
<main>
<aside class="sidebar">
<div class="side-memo" id="sideMemoWrap" style="display:none">
  <div class="side-memo-head">メモ</div>
  <textarea id="sideMemo" placeholder="口調、役割、物語上の目的など自由に記録"></textarea>
</div>
<input class="search" id="charSearch" placeholder="キャラクターを検索">
<div id="charList"></div>
<div class="side-head side-head-bottom"><button class="btn primary" id="newBtn">＋ 新規キャラ</button></div>
</aside>
<section class="editor" id="editor"><div class="empty">「＋ 新規キャラ」からキャラクターを作成できます。</div></section>
</main>
<div class="modal-wrap" id="modalWrap"><div class="modal">
<h2 id="modalTitle"></h2>
<input class="search" id="optionSearch" placeholder="候補を検索">
<div id="groupFilters" style="display:none;gap:6px;flex-wrap:wrap;margin-bottom:10px"></div><div class="custom"><input id="customInput" placeholder="候補にない要素を自由入力"><button class="btn" id="customAdd">追加</button></div>
<div id="hairLayout">
  <div class="options" id="options"></div>
  <div class="hair-preview" id="hairPreview">
    <div id="hairPreviewArt"></div>
    <div class="hair-preview-name" id="hairPreviewName"></div>
    <div class="hair-preview-note">髪型の参考画像</div>
  </div>
</div>
<div class="footer-actions"><button class="btn" id="modalClose">閉じる</button></div>
</div></div>

<div class="modal-wrap" id="oppositeModal"><div class="modal" style="width:min(430px,100%)">
<h2>対極キャラを作成</h2>
<p style="color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 14px">
現在のキャラクターと対照的な設定を持つ、新しいキャラクターを作成します。<br>
性別だけ先に選び、年齢・呼称・体格・髪色・容姿などの基本プロフィールは空欄で作成します。
</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<button class="btn primary" data-opposite-gender="男性">男性で作成</button>
<button class="btn primary" data-opposite-gender="女性">女性で作成</button>
</div>
<div class="footer-actions"><button class="btn" id="oppositeClose">キャンセル</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
const BASE = {"性別":["男性","女性","中性的","性別を明かしていない","性別を意識していない"],
"年齢":["10代前半","10代後半","20代前半","20代後半","30代","40代","50代","60代","70代以上","年齢不詳"],
"一人称":["私","わたし","僕","ぼく","俺","おれ","自分","うち","わし","あたし","名前で自称"],
"二人称":["あなた","君","きみ","お前","あんた","そちら","名字＋さん","名前＋さん","名前＋くん","名前＋ちゃん","呼び捨て","役職・肩書きで呼ぶ"],
"三人称":["彼","彼女","あの人","あいつ","あの子","あの方","あの人たち","あいつら","名前・名字で呼ぶ","役職・肩書きで呼ぶ"],
"よく読む書籍":["漫画","少年漫画","少女漫画","青年漫画","恋愛漫画","ギャグ漫画","ミステリー小説","恋愛小説","純文学","ライトノベル","ファンタジー小説","SF小説","ホラー小説","歴史小説","エッセイ","詩集","自己啓発書","ビジネス書","実用書","料理本","旅行ガイド","図鑑","専門書","学術書","ファッション雑誌","週刊誌","スポーツ雑誌","音楽雑誌","ゲーム雑誌","文芸誌","新聞","ほとんど本を読まない","グルメ漫画","スポーツ漫画","歴史漫画","ホラー漫画","日常系漫画","異世界漫画","冒険小説","推理小説","犯罪小説","青春小説","児童文学","古典文学","海外文学","伝記","ノンフィクション","哲学書","心理学書","歴史書","科学書","医学書","芸術書","写真集","絵本","旅行記","資格参考書","受験参考書","美容雑誌","料理雑誌","旅行雑誌","車・バイク雑誌","科学雑誌","経済誌","ゴシップ誌","同人誌","Web小説"],

function ensureAutoGroups(cat){
 if(GROUPS[cat]||!AUTO_GROUP_RULES[cat])return;
 const opts=allOptions(cat),used=new Set(),g={};
 AUTO_GROUP_RULES[cat].forEach(([label,keys])=>{
  const a=opts.filter(v=>!used.has(v)&&keys.some(k=>v.includes(k)));
  if(a.length){g[label]=a;a.forEach(v=>used.add(v))}
 });
 const rest=opts.filter(v=>!used.has(v));if(rest.length)g["その他"]=rest;
 GROUPS[cat]=g;
}

  [9,23,"天秤座"],[10,24,"蠍座"],[11,23,"射手座"],[12,22,"山羊座"]
 ];

function chooseDifferent(cat, sourceValues, targetGender){
 let opts = cat==="悩み" ? visibleOptionsForGender(cat,targetGender) : allOptions(cat);
 opts=opts.filter(x=>!sourceValues.includes(x));
 if(!opts.length)opts=allOptions(cat);
 return opts.length?opts[Math.floor(Math.random()*opts.length)]:null;
}
function visibleOptionsForGender(cat,gender){
 let opts=allOptions(cat);
 if(cat!=="悩み")return opts;
 const rules=CONDITIONAL_OPTIONS["悩み"];
 const male=new Set(rules["男性のみ"]||[]), female=new Set(rules["女性のみ"]||[]);
 if(gender==="男性")return opts.filter(x=>!female.has(x));
 if(gender==="女性")return opts.filter(x=>!male.has(x));
 return opts.filter(x=>!male.has(x)&&!female.has(x));
}
function oppositeValue(cat,value,targetGender){
 const mapped=OPPOSITES[cat]?.[value];
 if(mapped && allOptions(cat).includes(mapped))return mapped;
 return chooseDifferent(cat,[value],targetGender);

function createOpposite(gender){
 const src=getCurrent(); if(!src)return;
 const nc={id:uid(),name:(src.name||"名称未設定")+"の対極",notes:"",locked:false,fields:{}};
 CATS.forEach(k=>nc.fields[k]=[]);
 nc.fields["性別"]=[gender];

 const basicProfile=new Set(["性別","年齢","一人称","二人称","三人称","誕生日","星座","誕生石","家族構成","性格","職業・所属","肌の色","目の色","身長・体重・体格","身長","体重","骨格","胸","髪型","髪の特徴","髪色","容姿の良さ"]);
 CATS.filter(cat=>!basicProfile.has(cat)).forEach(cat=>{
   const source=src.fields[cat]||[];
   if(!source.length){
     const opts=visibleOptionsForGender(cat,gender);
     nc.fields[cat]=opts.length?[opts[Math.floor(Math.random()*opts.length)]]:[];
     return;
   }
   const results=[];
   source.forEach(v=>{
     let nv=oppositeValue(cat,v,gender);
     if(nv && !results.includes(nv))results.push(nv);
   });
   nc.fields[cat]=results.length?results:[chooseDifferent(cat,source,gender)].filter(Boolean);
 });

 // 性別依存の悩みを最終チェック
 const allowed=new Set(visibleOptionsForGender("悩み",gender));
 nc.fields["悩み"]=(nc.fields["悩み"]||[]).filter(x=>allowed.has(x));
 if(!nc.fields["悩み"].length){
   const w=visibleOptionsForGender("悩み",gender);
   if(w.length)nc.fields["悩み"]=[w[Math.floor(Math.random()*w.length)]];
 }

 $("#oppositeModal").classList.remove("show");
 toast("対極キャラを作成しました");
}

const HAIR_SOURCES={};
function hairPhotoHTML(name){
 const src=HAIR_PHOTOS[name];
 if(!src){
   const source=HAIR_PHOTO_SOURCES[name];
   return `<div class="hair-no-preview"><div style="font-size:28px;margin-bottom:8px">✂</div><div>実写見本の参照元を確認済み</div>${source?`<a class="hair-source-link" href="${source}" target="_blank" rel="noopener">Wikimedia Commonsで見る ↗</a>`:""}</div>`;
 }
 return `<img src="${src}" alt="${esc(name)}の参考画像">`;
}
function showHairPreview(name){
 const box=$("#hairPreview"); if(activeCat!=="髪型"){box.classList.remove("show");return}
 $("#hairPreviewArt").innerHTML=hairPhotoHTML(name);
 $("#hairPreviewName").textContent=name;
 let src=box.querySelector(".hair-preview-source");
 if(src)src.remove();
 box.classList.add("show");
}

function renderOptions(){
 const c=getCurrent(),q=$("#optionSearch").value.trim().toLowerCase(),sel=c.fields[activeCat]||[];
 let opts=visibleOptions(activeCat).filter(x=>x.toLowerCase().includes(q));
 const groups=GROUPS[activeCat];
 if(groups && activeGroup!=="すべて"){
   const allowed=new Set(groups[activeGroup]||[]);
   opts=opts.filter(x=>allowed.has(x));
 }
 const layout=$("#hairLayout"), preview=$("#hairPreview");
 layout.className=activeCat==="髪型"?"hair-layout":"";
 if(activeCat!=="髪型")preview.classList.remove("show");
 $("#options").innerHTML=opts.map(v=>`<button class="option ${sel.includes(v)?"selected":""}" data-opt="${esc(v)}">${sel.includes(v)?"✓ ":""}${esc(v)}</button>`).join("");
 document.querySelectorAll("[data-opt]").forEach(b=>{
   if(activeCat==="髪型"){
     b.onmouseenter=()=>showHairPreview(b.dataset.opt);
     b.onfocus=()=>showHairPreview(b.dataset.opt);
   }
   b.onclick=()=>{const v=b.dataset.opt;const a=c.fields[activeCat];const i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v);
 if(activeCat==="性別"){
   // 性別は一つだけ選択。新しく選んだ値を優先する。
   c.fields["性別"]=[v];
   const visible=new Set(visibleOptions("悩み"));
   c.fields["悩み"]=(c.fields["悩み"]||[]).filter(x=>visible.has(x));
   if(v!=="女性")c.fields["胸"]=[];
 }
 save();renderOptions();renderEditor()};
 });
 if(activeCat==="髪型" && opts.length){
   const first=sel.find(x=>opts.includes(x))||opts[0];
   showHairPreview(first);
 }
}
function addCustom(){const v=$("#customInput").value.trim();if(!v)return;if(!custom[activeCat])custom[activeCat]=[];if(!allOptions(activeCat).includes(v))custom[activeCat].push(v);const c=getCurrent();if(!c.fields[activeCat].includes(v))c.fields[activeCat].push(v);$("#customInput").value="";save();renderOptions();renderEditor()}
$("#newBtn").onclick=newChar;
$("#headerSaveBtn").onclick=()=>{if(getCurrent()){save();toast("保存しました")}};
$("#headerLockBtn").onclick=toggleLock;
$("#headerDeleteBtn").onclick=deleteCurrent;
$("#sideMemo").oninput=e=>{const c=getCurrent();if(c){c.notes=e.target.value;save()}};
 $("#charSearch").oninput=renderList; $("#optionSearch").oninput=renderOptions; $("#customAdd").onclick=addCustom; $("#customInput").onkeydown=e=>{if(e.key==="Enter")addCustom()};

$("#oppositeClose").onclick=()=>$("#oppositeModal").classList.remove("show");
$("#oppositeModal").onclick=e=>{if(e.target===$("#oppositeModal")[0])$("#oppositeModal").classList.remove("show")};
document.querySelectorAll("[data-opposite-gender]").forEach(b=>b.onclick=()=>createOpposite(b.dataset.oppositeGender));

$("#modalClose").onclick=()=>$("#modalWrap").classList.remove("show");
$("#modalWrap").addEventListener("mousedown",e=>{
  const modal=e.target.closest(".modal");
  if(!modal)$("#modalWrap").classList.remove("show");
});
$("#exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify({version:1,characters:chars,customOptions:custom},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="character-maker-backup.json";a.click();URL.revokeObjectURL(a.href)};
$("#importBtn").onclick=()=>$("#importFile").click(); $("#importFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.characters))throw 0;chars=d.characters;custom=d.customOptions||{};current=chars[0]?.id||null;save();renderList();renderEditor();toast("バックアップを復元しました")}catch{alert("バックアップファイルを読み込めませんでした。")}e.target.value=""};
renderList(); if(chars.length){current=chars[0].id;renderList();renderEditor()} else {updatePersistentUI()}
</script>
</body>
</html>
